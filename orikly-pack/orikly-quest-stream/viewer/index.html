<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orikly Class View</title>
<script>
// ======================= CONFIG =======================
const CONFIG = {
  fps: 15,                   // recording frame rate (the FPS chosen at the top of the page)
  videoBitsPerSecond: 1000000,
};
// ======================================================
</script>
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --text: #1b1d21; --muted: #6b7280;
    --border: #d9dce1; --accent: #2563eb; --ok: #16a34a; --bad: #dc2626; --rec: #dc2626;
    --tile: #000;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111316; --panel: #1b1e23; --text: #e8eaed; --muted: #9aa0a6;
      --border: #30343a; --accent: #60a5fa; --ok: #4ade80; --bad: #f87171; --rec: #ef4444;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center;
           padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border);
           position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 16px; margin: 0 8px 0 0; }
  button { font: inherit; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border);
           background: var(--panel); color: var(--text); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
  .muted { color: var(--muted); }
  label { display: inline-flex; gap: 6px; align-items: center; }
  main { display: grid; gap: 12px; padding: 16px;
         grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
  @media (min-width: 1300px) { main { grid-template-columns: repeat(5, 1fr); } }
  .tile { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
          display: flex; flex-direction: column; }
  .screen { position: relative; aspect-ratio: 16 / 9; background: var(--tile); cursor: zoom-in; }
  /* absolute: in an HQ window the canvas must not stretch the flex box (top and bottom were cut off) */
  .screen canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; }
  .screen .overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
                     color: #bbb; font-size: 13px; text-align: center; padding: 12px; pointer-events: none; }
  .rec { position: absolute; top: 8px; left: 8px; background: var(--rec); color: #fff; font-size: 11px;
         font-weight: 700; padding: 2px 6px; border-radius: 4px; display: none; }
  .tile.recording .rec { display: block; }
  .meta { padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .name { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .btns { display: flex; gap: 6px; flex-shrink: 0; }
  button.voice.on { background: var(--ok); border-color: var(--ok); color: #fff; }
  #voiceState { font-weight: 600; color: var(--ok); }
  #voiceState.err { color: var(--bad); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 6px; }
  .dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); }
  .info { font-size: 12px; }
  /* HQ window: a tile opened from the grid floats over the page in high quality. Drag the picture to move it,
     drag the top-right corner to resize it, click the picture to put it back into the grid. */
  .tile.win { position: fixed; z-index: 10; border-radius: 8px; box-shadow: 0 10px 40px rgba(0,0,0,.45); }
  .tile.win .screen { flex: 1; min-height: 0; aspect-ratio: auto; cursor: move; touch-action: none; }
  .tile.win .diag { display: none; }
  .grip { position: absolute; top: 0; right: 0; width: 34px; height: 34px; display: none; z-index: 2;
          align-items: center; justify-content: center; cursor: nesw-resize; touch-action: none;
          background: rgba(0,0,0,.55); color: #fff; font-size: 20px; border-bottom-left-radius: 8px; user-select: none; }
  .tile.win .grip { display: flex; }
  .hqbadge { position: absolute; bottom: 8px; left: 8px; background: var(--accent); color: #fff; font-size: 11px;
             font-weight: 700; padding: 2px 6px; border-radius: 4px; display: none; pointer-events: none; }
  .tile.hqon .hqbadge { display: block; }
  .diag { font-size: 11px; }
  /* headset outside the lesson app */
  .tile.left { border-color: var(--bad); box-shadow: 0 0 0 3px var(--bad); }
  .lessonline { font-size: 12px; font-weight: 600; color: var(--bad); display: none; }
  .tile.left .lessonline { display: block; }
  .appline { font-size: 12px; }
  #lessonInput { font: inherit; padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px;
                 background: var(--bg); color: var(--text); width: 180px; }
  dialog { border: 1px solid var(--border); border-radius: 10px; background: var(--panel); color: var(--text);
           padding: 16px; width: min(560px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgba(0,0,0,.5); }
  dialog h2 { margin: 0 0 12px; font-size: 16px; }
  dialog input[type=text] { font: inherit; padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px;
                            background: var(--bg); color: var(--text); width: 100%; }
  dialog textarea { font: inherit; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px;
                    background: var(--bg); color: var(--text); width: 100%; margin-top: 4px; resize: vertical; }
  .clrows { display: grid; grid-template-columns: 1fr 1.2fr; gap: 6px 10px; align-items: center;
            margin: 8px 0 14px; max-height: 50vh; overflow: auto; }
  .clrows select { font: inherit; padding: 4px 6px; border: 1px solid var(--border); border-radius: 6px;
                   background: var(--bg); color: var(--text); width: 100%; }
  .devrows { display: grid; grid-template-columns: 1fr 1.4fr; gap: 6px; margin: 8px 0 14px; max-height: 50vh; overflow: auto; }
  .actions { display: flex; justify-content: flex-end; gap: 8px; }
  #warn { padding: 8px 16px; background: #fef3c7; color: #78350f; display: none; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) #warn { background: #422006; color: #fde68a; } }
</style>
</head>
<body>
<header>
  <h1>Orikly Class View</h1>
  <button id="startAll" class="primary">Start all</button>
  <button id="stopAll">Stop all</button>
  <label id="classBox" title="Each class has its own names for the headsets">Class
    <select id="classSelect"></select></label>
  <button id="renameClass" title="Rename this class">✎</button>
  <button id="openClassList" title="Class list: students and their headsets">Class list</button>
  <label id="lessonBox" title="App of this lesson, as shown on the tiles. Empty = no check.">Lesson app
    <input id="lessonInput" list="appList" placeholder="type or pick…" autocomplete="off"></label>
  <datalist id="appList"></datalist>
  <label id="fpsBox" title="Frames per second asked from every headset (headsets with app 0.4.6+)">FPS
    <select id="fpsSelect"><option>10</option><option>15</option><option>20</option><option>24</option></select></label>
  <button id="voiceAll" title="Talk to every headset">Voice all</button>
  <button id="voiceOff" title="Stop talking to all headsets">Voice off</button>
  <span id="voiceState"></span>
  <label><input type="checkbox" id="recordToggle" checked> Record</label>
  <button id="pickFolder">Choose folder…</button>
  <span id="folderName" class="muted">No folder — recordings will download on stop</span>
  <span id="summary" class="muted"></span>
</header>
<dialog id="classList">
  <h2 id="clTitle">Class list</h2>
  <label style="display:block">Students, separated by commas
    <textarea id="clStudents" rows="3" placeholder="Ana, Pablo, Lucía, …"></textarea></label>
  <p class="muted" id="clLeft"></p>
  <div class="clrows" id="clRows"></div>
  <div class="actions"><button id="clCancel">Cancel</button><button id="clSave" class="primary">Save</button></div>
</dialog>
<div id="warn"></div>
<main id="grid"></main>

<script>
const $ = (id) => document.getElementById(id);
// The page is served by orikly-server: headsets are found by themselves (by a unique id).

// ---------- recordings folder (remembered between sessions) ----------
let folder = null;

function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open("orikly", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("kv");
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function kvGet(k) {
  try { const db = await idb(); return await new Promise((res) => {
    const t = db.transaction("kv").objectStore("kv").get(k); t.onsuccess = () => res(t.result); t.onerror = () => res(null); });
  } catch { return null; }
}
async function kvSet(k, v) {
  try { const db = await idb(); db.transaction("kv", "readwrite").objectStore("kv").put(v, k); } catch {}
}

function showFolder() {
  $("folderName").textContent = folder ? `Folder: ${folder.name}` : "No folder — recordings will download on stop";
}
async function pickFolder() {
  if (!window.showDirectoryPicker) { warn("This browser cannot write to a folder. Use Chrome."); return; }
  try {
    folder = await showDirectoryPicker({ id: "orikly", mode: "readwrite" });
    await kvSet("folder", folder);
    showFolder();
  } catch {}
}
// Called from a click (Start), so Chrome may show the permission prompt.
async function ensureFolderPermission() {
  if (!folder) return false;
  try {
    if (await folder.queryPermission({ mode: "readwrite" }) === "granted") return true;
    return await folder.requestPermission({ mode: "readwrite" }) === "granted";
  } catch { return false; }
}

function warn(text) { const w = $("warn"); w.textContent = text; w.style.display = text ? "block" : "none"; }

function pickMime() {
  // avc3 keeps codec settings inside the stream (Chrome warns that avc1 files can break otherwise).
  const types = ["video/mp4;codecs=avc3", "video/mp4;codecs=avc1", "video/mp4", "video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm"];
  return types.find((t) => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || "";
}
const stamp = () => {
  const d = new Date(), p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}_${p(d.getHours())}-${p(d.getMinutes())}-${p(d.getSeconds())}`;
};

// ---------- one headset ----------
class Tile {
  constructor(dev) {
    this.dev = dev;
    this.active = false;
    this.abort = null;
    this.lastFrameAt = 0;
    this.recorder = null;
    this.el = document.createElement("div");
    this.el.className = "tile";
    this.el.innerHTML = `
      <div class="screen"><canvas width="480" height="480"></canvas>
        <div class="overlay">Idle</div><div class="rec">● REC</div><div class="hqbadge">HQ</div>
        <div class="grip" title="Drag to resize">⤢</div></div>
      <div class="meta">
        <div class="row"><span class="name"></span>
          <span class="btns"><button class="voice" title="Talk to this headset (laptop microphone)">Connect Voice</button><button class="toggle primary">Start</button></span></div>
        <div class="row info"><span class="state"><span class="dot"></span><span class="stext">Checking…</span></span>
          <span class="muted extra"></span></div>
        <div class="lessonline"></div>
        <div class="appline muted"></div>
        <div class="muted diag"></div>
      </div>`;
    this.canvas = this.el.querySelector("canvas");
    this.ctx = this.canvas.getContext("2d");
    this.overlay = this.el.querySelector(".overlay");
    this.btn = this.el.querySelector(".toggle");
    this.dot = this.el.querySelector(".dot");
    this.stext = this.el.querySelector(".stext");
    this.extra = this.el.querySelector(".extra");
    this.diag = this.el.querySelector(".diag");
    this.lessonLine = this.el.querySelector(".lessonline");
    this.appLine = this.el.querySelector(".appline");
    this.nameEl = this.el.querySelector(".name");
    this.showTitle();
    this.nameEl.title = "Click to rename";
    this.nameEl.style.cursor = "pointer";
    this.nameEl.onclick = () => renameTile(this);
    this.btn.onclick = () => (this.active ? this.stop() : this.start($("recordToggle").checked));
    this.voiceBtn = this.el.querySelector(".voice");
    this.voiceBtn.onclick = () => setVoice([this], !voice.targets.has(this.dev.id));
    hqWindowControls(this);
    this.blank();
  }

  // Server mode: own name given on this laptop, else what the server reports.
  title() {
    const sn = this.dev.serial ? `${this.dev.name || "Quest"} · SN ${this.dev.serial}` : "";
    return labels()[this.dev.id] || sn || this.dev.label || this.dev.name || this.dev.id;
  }

  showTitle() {
    this.nameEl.textContent = this.title();
  }

  showVoice() {
    const on = voice.targets.has(this.dev.id);
    this.voiceBtn.classList.toggle("on", on);
    this.voiceBtn.textContent = on ? "Voice ●" : "Connect Voice";
  }

  blank() {
    this.ctx.fillStyle = "#000";
    this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
  }

  setState(kind, text) {
    this.dot.className = "dot" + (kind === "ok" ? " ok" : kind === "bad" ? " bad" : "");
    this.stext.textContent = text;
  }

  async start(record) {
    if (this.active) return;
    this.active = true;
    this.btn.textContent = "Stop";
    this.btn.className = "toggle danger";
    this.overlay.textContent = "Connecting…";
    // Permission must be asked inside the click; recording itself starts on the first frame,
    // so the video gets the real frame size from the start.
    this.wantRecord = record;
    this.canWriteFolder = record && (await ensureFolderPermission());
    this.connect();
    updateSummary();
  }

  async stop() {
    this.active = false;
    this.fps = null; this.fpsStart = 0; this.fpsFrames = 0;
    this.wantRecord = false;
    this.abort?.abort();
    this.abort = null;
    this.resetDecoder(null);
    this.btn.textContent = "Start";
    this.btn.className = "toggle primary";
    this.overlay.textContent = "Idle";
    await this.stopRecording();
    updateSummary();
  }

  connect() {
    if (this.active) this.connectWs();
  }

  // One WebSocket per tile (Chrome allows only 6 HTTP streams to one address).
  connectWs() {
    const ctrl = new AbortController();
    this.abort = ctrl;
    const proto = location.protocol === "https:" ? "wss" : "ws"; // https: through "tailscale serve"
    const url = `${proto}://${location.host}/view/${encodeURIComponent(this.dev.id)}${this.hq ? "?hq=1" : ""}`;
    this.resetDecoder(null); // a new connection starts with a key frame
    const ws = new WebSocket(url);
    ws.binaryType = "arraybuffer";
    ctrl.signal.addEventListener("abort", () => ws.close());
    this.lastFrameAt = Date.now();
    this.watchdog(ctrl);
    ws.onmessage = (e) => {
      if (typeof e.data === "string") return;
      const buf = new Uint8Array(e.data);
      this.lastFrameAt = Date.now();
      // JPEG (app before 0.5.0) starts with FF D8; H.264 messages start with a type byte (1 or 2).
      if (buf[0] === 0xff && buf[1] === 0xd8) {
        // Draw only the newest frame; if decoding falls behind, skip old ones instead of lagging.
        this.pending = buf;
        if (!this.drawing) this.drawPending();
      } else this.handleH264(buf);
    };
    ws.onclose = () => {
      if (ctrl.signal.aborted && (!this.active || this.abort !== ctrl)) return; // stopped or switched by us
      this.setState("bad", "No connection");
      this.overlay.textContent = "No connection — retrying…";
      if (this.active && this.abort === ctrl) setTimeout(() => this.connect(), 3000);
    };
  }

  // ---------- H.264 (app 0.5.0+): 1 byte type (1 = key frame with SPS/PPS, 2 = ordinary) + Annex B ----------
  // Frames depend on each other, so all are decoded in order; only the newest decoded picture is drawn.
  handleH264(buf) {
    if (!window.VideoDecoder) {
      this.overlay.textContent = "H.264 video needs Chrome, page opened on localhost or https";
      return;
    }
    const key = buf[0] === 1;
    const data = buf.subarray(1);
    if (key) {
      const codec = avcCodec(data);
      if (!this.decoder || this.decoder.state === "closed" || codec !== this.codec) this.resetDecoder(codec);
      this.waitKey = false;
    }
    if (!this.decoder || this.waitKey) return; // nothing to start from until the next key frame
    if (this.decoder.decodeQueueSize > 30) { // this laptop fell behind: start again from the next key frame
      this.resetDecoder(null);
      return;
    }
    try {
      this.ts = (this.ts || 0) + 1;
      this.decoder.decode(new EncodedVideoChunk({ type: key ? "key" : "delta", timestamp: this.ts * 1000, data }));
    } catch { this.resetDecoder(null); }
  }

  resetDecoder(codec) {
    try { if (this.decoder && this.decoder.state !== "closed") this.decoder.close(); } catch {}
    this.decoder = null;
    this.waitKey = true;
    this.codec = codec;
    if (!codec || !window.VideoDecoder) return;
    this.decoder = new VideoDecoder({
      output: (frame) => {
        try { this.paint(frame, frame.displayWidth, frame.displayHeight); } finally { frame.close(); }
      },
      error: () => { this.decoder = null; this.waitKey = true; },
    });
    this.decoder.configure({ codec, optimizeForLatency: true });
  }

  async drawPending() {
    this.drawing = true;
    while (this.pending) {
      const jpeg = this.pending;
      this.pending = null;
      await this.draw(jpeg);
    }
    this.drawing = false;
  }

  watchdog(ctrl) {
    const t = setInterval(() => {
      if (ctrl.signal.aborted || this.abort !== ctrl) return clearInterval(t);
      if (Date.now() - this.lastFrameAt > 5000) { clearInterval(t); ctrl.abort(); }
    }, 1000);
  }

  // HQ window asks the headset for the high-quality stream (?hq=1), the grid uses the normal one.
  setHQ(on) {
    if (this.hq === on) return;
    this.hq = on;
    this.el.classList.toggle("hqon", on);
    if (this.active) { this.abort?.abort(); this.connect(); }
  }

  async draw(jpeg) {
    this.lastFrameAt = Date.now();
    try {
      const bmp = await createImageBitmap(new Blob([jpeg], { type: "image/jpeg" }));
      try { this.paint(bmp, bmp.width, bmp.height); } finally { bmp.close(); }
    } catch {}
  }

  // Draws one picture (JPEG bitmap or decoded H.264 frame) and keeps the counters and recording going.
  paint(src, w, h) {
    this.lastFrameAt = Date.now();
    try {
      if (this.canvas.width !== w || this.canvas.height !== h) {
        // Size change only before recording starts would be ideal; recorder keeps working anyway.
        this.canvas.width = w; this.canvas.height = h;
      }
      this.ctx.drawImage(src, 0, 0);
      // Recording uses its own canvas with a fixed size, so switching quality does not break the file.
      if (this.recCanvas) { // fit the picture into the fixed-size recording, keeping its shape
        const rw = this.recCanvas.width, rh = this.recCanvas.height, k = Math.min(rw / w, rh / h);
        const dw = Math.round(w * k), dh = Math.round(h * k);
        if (dw !== rw || dh !== rh) { this.recCtx.fillStyle = "#000"; this.recCtx.fillRect(0, 0, rw, rh); }
        this.recCtx.drawImage(src, (rw - dw) >> 1, (rh - dh) >> 1, dw, dh);
      }
      this.overlay.textContent = "";
      // Real frame rate as seen on this laptop.
      const now = performance.now();
      this.fpsFrames = (this.fpsFrames || 0) + 1;
      if (!this.fpsStart) this.fpsStart = now;
      if (now - this.fpsStart >= 2000) {
        this.fps = Math.round((this.fpsFrames * 1000) / (now - this.fpsStart));
        this.fpsFrames = 0; this.fpsStart = now;
      }
      this.setState("ok", this.fps != null ? `Streaming · ${this.fps} fps` : "Streaming");
      if (this.wantRecord && !this.recorder && !this.startingRec) {
        this.startingRec = true;
        this.startRecording().finally(() => { this.startingRec = false; updateSummary(); });
      }
    } catch {}
  }

  async startRecording() {
    const mime = pickMime();
    if (!mime) { warn("This browser cannot record video. Use Chrome."); return; }
    const ext = mime.startsWith("video/mp4") ? "mp4" : "webm";
    const cls = className() ? className() + "_" : "";
    const safe = (cls + this.title()).replace(/[\\/:*?"<>|·]+/g, "-").replace(/\s+/g, "_");
    const fileName = `${safe}_${stamp()}.${ext}`;
    const h = Math.min(this.canvas.height, 480);
    const w = Math.round((this.canvas.width * h) / this.canvas.height / 2) * 2;
    this.recCanvas = Object.assign(document.createElement("canvas"), { width: w, height: h });
    this.recCtx = this.recCanvas.getContext("2d");
    this.recCtx.drawImage(this.canvas, 0, 0, w, h);
    const stream = this.recCanvas.captureStream(CONFIG.fps);
    const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: CONFIG.videoBitsPerSecond });
    const job = { rec, fileName, mime, chunks: [], writable: null, queue: Promise.resolve() };

    if (this.canWriteFolder) {
      try {
        const fh = await folder.getFileHandle(fileName, { create: true });
        job.writable = await fh.createWritable();
      } catch (e) { warn(`Cannot write to folder: ${e.message}. Recording in memory instead.`); }
    }
    rec.ondataavailable = (e) => {
      if (!e.data || !e.data.size) return;
      if (job.writable) job.queue = job.queue.then(() => job.writable.write(e.data)).catch(() => {});
      else job.chunks.push(e.data);
    };
    job.done = new Promise((res) => (rec.onstop = res));
    if (!this.active) { job.writable?.close().catch(() => {}); this.recCanvas = null; return; }
    rec.start(2000); // flush to disk every 2 s
    this.recorder = job;
    this.el.classList.add("recording");
  }

  async stopRecording() {
    const job = this.recorder;
    if (!job) return;
    this.recorder = null;
    this.el.classList.remove("recording");
    if (job.rec.state !== "inactive") job.rec.stop();
    await job.done;
    this.recCanvas = null;
    if (job.writable) {
      await job.queue;
      await job.writable.close().catch(() => {});
    } else if (job.chunks.length) {
      const url = URL.createObjectURL(new Blob(job.chunks, { type: job.mime }));
      const a = Object.assign(document.createElement("a"), { href: url, download: job.fileName });
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    }
  }

  // Server mode: info comes from /api/devices for all headsets at once.
  applyInfo(info) {
    const s = info.status || {};
    const parts = [];
    if (s.battery != null) parts.push(`🔋 ${s.battery}%`);
    if (s.rssi != null) parts.push(`📶 ${s.rssi} dBm`);
    if (s.codec === "h264") { if (s.bitrateScale != null && s.bitrateScale < 100) parts.push(`⚠ bitrate ${s.bitrateScale}%`); }
    else if (s.level > 0) parts.push(`⚠ quality −${s.level}`); // headset lowered quality to keep the frame rate
    if (this.active && s.rtt > 0) parts.push(`⏱ ${s.rtt} ms`); // headset → laptop round trip
    this.extra.textContent = info.online ? parts.join("  ") : "";
    // Diagnostics: "system" = frames/s the headset OS gives to the app, "sent" = frames/s sent to this laptop.
    // System ~1 fps -> the headset itself gives no frames; system 10+ but few arrive -> frames are lost on the way.
    if (info.online && s.capturing && s.sysFps != null) {
      const d = [info.model, s.codec === "h264" ? `H.264 ${Math.round((s.bitrate || 0) / 1000)} kbit/s · encoder ${s.sysFps} fps` : `system ${s.sysFps} fps`].filter(Boolean);
      if (this.active) d.push(`sent ${Math.round(s.sentFps * 10) / 10}${s.targetFps ? " of " + s.targetFps : ""} fps`);
      if (s.capture) d.push(`capture ${s.capture}`);
      if (s.source) d.push(`screen ${s.source}${s.hz ? " " + s.hz + " Hz" : ""}`);
      this.diag.textContent = d.join(" · ");
      this.diag.title = [info.model, info.version && "app " + info.version, s.os && "OS " + s.os].filter(Boolean).join(" · ");
    } else this.diag.textContent = "";
    // Lesson app check (decided by the server program).
    this.el.classList.toggle("left", info.lesson === "left");
    this.lessonLine.textContent = info.lesson === "left" ? `⚠ Left lesson app: ${info.lessonText}` : "";
    const stateText = { running: "", paused: " (menu / paused)", closed: " (closed)" };
    if (!info.online) this.appLine.textContent = "";
    else if (s.usageAccess === false) this.appLine.textContent = "App: unknown — allow Usage access on the headset";
    else if (s.usageAccess) this.appLine.textContent = `App: ${s.app || s.appPkg || "none"}${stateText[s.appState] || ""}`;
    else this.appLine.textContent = "";
    this.appLine.title = s.appPkg ? `${s.appPkg}${s.appEvent ? " · last event " + s.appEvent : ""}` : "";
    if (s.app) knownApps.add(s.app);
    // Serial number: every non-empty answer, shown on hover; a real-looking one goes into the title.
    if (s.serials) {
      const all = Object.entries(s.serials).map(([k, v]) => `${k}=${v}`).join("\n");
      const base = [info.model, info.version && "app " + info.version, s.os && "OS " + s.os].filter(Boolean).join(" · ");
      this.diag.title = base + "\nSerial number attempts:\n" + all;
      const real = Object.values(s.serials).find((v) => /^[A-Za-z0-9]{8,}$/.test(v) && !/^unknown$/i.test(v));
      if (real && this.dev.serial !== real) { this.dev.serial = real; this.showTitle(); sortTiles(); }
      if (!real) this.diag.textContent += (this.diag.textContent ? " · " : "") + "SN: " + Object.entries(s.serials).map(([k, v]) => `${k}=${v}`).join(", ");
    }
    if (this.active && Date.now() - this.lastFrameAt < 5000) return;
    if (!info.online) this.setState("bad", "Offline — headset not connected");
    else if (s.capturing === false) this.setState("bad", "Capture stopped — tap Iniciar on headset");
    else if (!this.active) this.setState("ok", "Online · ready");
  }

}



// Codec string for the browser's decoder, from the SPS in a key frame (Annex B): "avc1.PPCCLL".
function avcCodec(data) {
  for (let i = 0; i + 4 < data.length; i++) {
    if (data[i] === 0 && data[i + 1] === 0 && data[i + 2] === 1 && (data[i + 3] & 0x1f) === 7) {
      const hex = (b) => b.toString(16).padStart(2, "0").toUpperCase();
      return `avc1.${hex(data[i + 4])}${hex(data[i + 5])}${hex(data[i + 6])}`;
    }
  }
  return "avc1.42E01F"; // Baseline 3.1
}

// ---------- page ----------
const tiles = [];
// App names reported by headsets: suggestions for the lesson app field (the teacher still chooses).
const knownApps = new Set();
function refreshAppList() {
  const dl = $("appList");
  const have = new Set([...dl.options].map((o) => o.value));
  for (const a of knownApps) if (!have.has(a)) dl.appendChild(new Option(a));
}
function addTile(dev) {
  const t = new Tile(dev);
  tiles.push(t);
  sortTiles();
  return t;
}
function sortTiles() {
  tiles.sort((a, b) => a.title().localeCompare(b.title(), undefined, { numeric: true }));
  tiles.forEach((x) => $("grid").appendChild(x.el));
}

// Server mode: headsets appear by themselves, identified by a unique id (names can repeat).
// Headsets seen before are kept so their tiles stay in place; names given here are remembered.
const KNOWN_KEY = "orikly-known-headsets-v2";
// Classes and the headsets' names in each class are kept by the server program (orikly-server.json).
let classes = { current: 0, classes: [] };
const className = () => classes.classes[classes.current]?.name || "";
function labels() {
  return classes.classes[classes.current]?.names || {};
}
function showClasses() {
  const sel = $("classSelect");
  sel.innerHTML = "";
  classes.classes.forEach((c, i) => sel.add(new Option(c.name, String(i))));
  sel.value = String(classes.current);
  tiles.forEach((t) => t.showTitle());
  sortTiles();
}
async function classesCall(query) {
  try {
    const r = await fetch("/api/classes" + (query ? "?" + query : ""), { method: query ? "POST" : "GET", cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    classes = await r.json();
    showClasses();
    return true;
  } catch { warn("Cannot reach the server program to save names."); return false; }
}
// ---------- class list: paste the students, pick a name for every headset ----------
const parseStudents = (text) => [...new Set(text.split(",").map((x) => x.trim()).filter(Boolean))];
function headsetLabel(t) { return t.dev.label || t.dev.name || t.dev.id; }
function openClassList() {
  const c = classes.classes[classes.current];
  if (!c) return;
  $("clTitle").textContent = `Class list — ${c.name}`;
  $("clStudents").value = (c.students || []).join(", ");
  const box = $("clRows");
  box.innerHTML = "<span class='muted'>Headset</span><span class='muted'>Student</span>";
  for (const t of tiles) {
    const label = document.createElement("span");
    const online = t.dot.classList.contains("ok") || /Streaming|Online/.test(t.stext.textContent);
    label.innerHTML = `<span class="dot ${online ? "ok" : ""}"></span>`;
    label.append(headsetLabel(t));
    const sel = document.createElement("select");
    sel.dataset.id = t.dev.id;
    sel.dataset.value = c.names[t.dev.id] || "";
    sel.onchange = () => { sel.dataset.value = sel.value; refreshClassList(); };
    box.append(label, sel);
  }
  refreshClassList();
  $("classList").showModal();
}
// Every list shows the students not yet taken by another headset, so the choice shrinks as you go.
function refreshClassList() {
  const students = parseStudents($("clStudents").value);
  const sels = [...document.querySelectorAll("#clRows select")];
  const taken = new Set(sels.map((s) => s.dataset.value).filter(Boolean));
  for (const sel of sels) {
    const mine = sel.dataset.value;
    sel.innerHTML = "";
    sel.add(new Option("—", ""));
    const options = students.filter((n) => n === mine || !taken.has(n));
    if (mine && !students.includes(mine)) options.unshift(mine); // a name given before, not in the list
    for (const n of options) sel.add(new Option(n, n));
    sel.value = mine;
  }
  const left = students.filter((n) => !taken.has(n));
  $("clLeft").textContent = students.length
    ? (left.length ? `Not assigned yet (${left.length}): ${left.join(", ")}` : "Every student has a headset.")
    : "Paste the names first.";
}
async function saveClassList() {
  const names = {};
  for (const sel of document.querySelectorAll("#clRows select")) if (sel.dataset.value) names[sel.dataset.id] = sel.dataset.value;
  try {
    const r = await fetch(`/api/classes?assign=${classes.current}`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ students: parseStudents($("clStudents").value), names }),
    });
    if (!r.ok) throw new Error(r.status);
    classes = await r.json();
    showClasses();
    $("classList").close();
  } catch { alert("Cannot save: is the server program running?"); }
}

async function renameTile(tile) {
  const name = prompt(`Name of this headset in ${className()} (e.g. the student's name). Empty = default name.`, labels()[tile.dev.id] || "");
  if (name === null) return;
  await classesCall(`class=${classes.current}&id=${encodeURIComponent(tile.dev.id)}&name=${encodeURIComponent(name.trim())}`);
}
async function pollServer() {
  try {
    const list = await (await fetch("/api/devices", { cache: "no-store" })).json();
    warn("");
    let known = [];
    try { known = JSON.parse(localStorage.getItem(KNOWN_KEY) || "[]"); } catch {}
    for (const info of list) {
      let t = tiles.find((x) => x.dev.id === info.id);
      if (!t) t = addTile({ id: info.id, name: info.name, label: info.label });
      if (t.dev.label !== info.label) { Object.assign(t.dev, { name: info.name, label: info.label }); t.showTitle(); sortTiles(); }
      t.applyInfo(info);
      const k = known.find((x) => x.id === info.id);
      if (k) k.label = info.label; else known.push({ id: info.id, name: info.name, label: info.label });
    }
    for (const t of tiles) if (!list.some((i) => i.id === t.dev.id)) t.applyInfo({ online: false });
    try { localStorage.setItem(KNOWN_KEY, JSON.stringify(known)); } catch {}
    updateSummary();
    refreshAppList();
  } catch {
    warn("Server program is not running. Start orikly-server on this laptop.");
  }
}
try { JSON.parse(localStorage.getItem(KNOWN_KEY) || "[]").forEach(addTile); } catch {}

// ---------- HQ windows ----------
// Click a tile in the grid: it opens over the whole screen in high quality. Drag its top-right corner to make it
// smaller, drag the picture to move it. Any number of tiles can be open like this at once, each in HQ.
// Click the picture of a window (without dragging): the tile goes back to its place in the grid, normal quality.
const WIN_MIN_W = 240, WIN_MIN_H = 180, DRAG_PX = 5;
let winTop = 10;
function winFront(t) { t.el.style.zIndex = String(++winTop); }
function winPlace(t) {
  const r = t.win, vw = innerWidth, vh = innerHeight;
  r.w = Math.max(WIN_MIN_W, Math.min(r.w, vw));
  r.h = Math.max(WIN_MIN_H, Math.min(r.h, vh));
  r.x = Math.max(0, Math.min(r.x, vw - r.w));
  r.y = Math.max(0, Math.min(r.y, vh - r.h));
  Object.assign(t.el.style, { left: r.x + "px", top: r.y + "px", width: r.w + "px", height: r.h + "px" });
}
function openWindow(t) {
  if (t.win) return;
  t.win = { x: 0, y: 0, w: innerWidth, h: innerHeight };
  t.el.classList.add("win");
  winPlace(t);
  winFront(t);
  t.setHQ(true);
}
function closeWindow(t) {
  if (!t.win) return;
  t.win = null;
  t.el.classList.remove("win");
  for (const k of ["left", "top", "width", "height", "zIndex"]) t.el.style[k] = "";
  t.setHQ(false);
}
// Pointer drag helper: calls onMove(dx, dy) after the pointer moved more than DRAG_PX; onEnd(moved) at the end.
function dragFrom(el, e, onMove, onEnd) {
  const sx = e.clientX, sy = e.clientY;
  let moved = false;
  try { el.setPointerCapture(e.pointerId); } catch {}
  const move = (ev) => {
    const dx = ev.clientX - sx, dy = ev.clientY - sy;
    if (!moved && Math.hypot(dx, dy) < DRAG_PX) return;
    moved = true;
    onMove(dx, dy);
  };
  const end = () => {
    el.removeEventListener("pointermove", move);
    el.removeEventListener("pointerup", end);
    el.removeEventListener("pointercancel", end);
    onEnd(moved);
  };
  el.addEventListener("pointermove", move);
  el.addEventListener("pointerup", end);
  el.addEventListener("pointercancel", end);
}
function hqWindowControls(t) {
  const screen = t.el.querySelector(".screen"), grip = t.el.querySelector(".grip");
  screen.addEventListener("pointerdown", (e) => {
    if (e.button !== 0 || e.target === grip) return;
    if (!t.win) { dragFrom(screen, e, () => {}, (moved) => { if (!moved) openWindow(t); }); return; }
    winFront(t);
    const start = { ...t.win };
    dragFrom(screen, e,
      (dx, dy) => { t.win.x = start.x + dx; t.win.y = start.y + dy; winPlace(t); },
      (moved) => { if (!moved) closeWindow(t); });
  });
  // Top-right corner: the right edge and the top edge follow the pointer.
  grip.addEventListener("pointerdown", (e) => {
    if (e.button !== 0 || !t.win) return;
    e.stopPropagation();
    winFront(t);
    const start = { ...t.win };
    dragFrom(grip, e, (dx, dy) => {
      t.win.w = Math.max(WIN_MIN_W, Math.min(start.w + dx, innerWidth - start.x));
      const h = Math.max(WIN_MIN_H, Math.min(start.h - dy, start.y + start.h));
      t.win.y = start.y + start.h - h;
      t.win.h = h;
      winPlace(t);
    }, () => {});
  });
}
// Esc puts the top window back into the grid.
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  const open = tiles.filter((t) => t.win);
  if (open.length) closeWindow(open.reduce((a, b) => (+a.el.style.zIndex > +b.el.style.zIndex ? a : b)));
});
addEventListener("resize", () => tiles.forEach((t) => t.win && winPlace(t)));

// ---------- Voice: the laptop microphone → the chosen headsets (app 0.5.9+) ----------
// «Connect Voice» on a tile adds/removes that headset; «Voice all» / «Voice off» — all at once. While at least
// one headset is chosen, the microphone is live: PCM 16 bit, mono, 16 kHz, 40 ms pieces → server /voice → headsets.
// The microphone needs a secure page: localhost or https (Tailscale).
const voice = { targets: new Set(), ws: null, ctx: null, stream: null, starting: null };
const VOICE_WORKLET = `
class Pcm16k extends AudioWorkletProcessor {
  constructor(o) { super(); this.step = o.processorOptions.rate / 16000; this.acc = 0; this.cnt = 0; this.t = 0;
                   this.buf = new Int16Array(640); this.n = 0; }
  process(inputs) {
    const ch = inputs[0] && inputs[0][0];
    if (ch) for (let i = 0; i < ch.length; i++) {
      this.acc += ch[i]; this.cnt++; this.t += 1;
      if (this.t >= this.step) { // average of the input samples = simple low-pass before going down to 16 kHz
        let v = this.acc / this.cnt; this.acc = 0; this.cnt = 0; this.t -= this.step;
        v = v > 1 ? 1 : v < -1 ? -1 : v;
        this.buf[this.n++] = v < 0 ? v * 0x8000 : v * 0x7fff;
        if (this.n === this.buf.length) { this.port.postMessage(this.buf.buffer, [this.buf.buffer]); this.buf = new Int16Array(640); this.n = 0; }
      }
    }
    return true;
  }
}
registerProcessor("pcm16k", Pcm16k);`;

function voiceStatus(text, err) {
  const el = $("voiceState");
  el.textContent = text;
  el.classList.toggle("err", !!err);
}
function setVoice(list, on) {
  for (const t of list) on ? voice.targets.add(t.dev.id) : voice.targets.delete(t.dev.id);
  tiles.forEach((t) => t.showVoice());
  voiceSync();
}
async function voiceSync() {
  const n = voice.targets.size;
  if (n && !voice.ctx && !voice.starting) voice.starting = voiceStart().finally(() => { voice.starting = null; });
  if (voice.starting) await voice.starting;
  if (!voice.targets.size) { voiceStop(); if (!$("voiceState").classList.contains("err")) voiceStatus(""); return; }
  if (!voice.ctx) return; // microphone failed: voiceStart showed why
  voiceStatus(`🎙 Voice → ${voice.targets.size}`);
  if (voice.ws && voice.ws.readyState === 1) voice.ws.send(JSON.stringify({ targets: [...voice.targets] }));
}
function voiceFail(text) {
  voice.targets.clear();
  tiles.forEach((t) => t.showVoice());
  voiceStatus(text, true);
}
async function voiceStart() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.AudioWorkletNode) {
    return voiceFail("Voice needs Chrome and the page on localhost or https (Tailscale)");
  }
  try {
    voice.stream = await navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true },
    });
  } catch (e) {
    // Say the real reason: a cloud server (Azure) has no microphone at all — open the page on the laptop.
    const why = {
      NotFoundError: "No microphone on this computer. A cloud server has none: open this page on your laptop (Tailscale https address), or turn on microphone redirection in Remote Desktop.",
      NotAllowedError: "Microphone blocked: allow it for this page (icon left of the address) and in the system privacy settings.",
      NotReadableError: "Microphone busy or not working (another app is using it?).",
      OverconstrainedError: "This microphone does not support the needed settings.",
    }[e && e.name];
    return voiceFail(why || "Cannot use the microphone: " + (e && (e.name + " " + e.message)));
  }
  try {
    const ctx = new AudioContext();
    await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([VOICE_WORKLET], { type: "application/javascript" })));
    const node = new AudioWorkletNode(ctx, "pcm16k", { processorOptions: { rate: ctx.sampleRate } });
    node.port.onmessage = (e) => {
      const ws = voice.ws;
      if (ws && ws.readyState === 1 && ws.bufferedAmount < 64 * 1024) ws.send(e.data); // never pile up delay
    };
    const mute = ctx.createGain(); mute.gain.value = 0; // the graph must reach the speakers to run; silent
    ctx.createMediaStreamSource(voice.stream).connect(node);
    node.connect(mute).connect(ctx.destination);
    if (ctx.state === "suspended") await ctx.resume();
    voice.ctx = ctx;
  } catch (e) {
    voiceStop();
    return voiceFail("Cannot start the microphone: " + (e && e.message ? e.message : e));
  }
  voiceConnect();
}
function voiceConnect() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(`${proto}://${location.host}/voice`);
  ws.binaryType = "arraybuffer";
  voice.ws = ws;
  ws.onopen = () => ws.send(JSON.stringify({ targets: [...voice.targets] }));
  ws.onclose = () => {
    if (voice.ws !== ws) return;
    voice.ws = null;
    if (voice.targets.size && voice.ctx) { voiceStatus("🎙 Voice: reconnecting…", true); setTimeout(() => { if (voice.ctx && !voice.ws) { voiceConnect(); voiceSync(); } }, 2000); }
  };
}
function voiceStop() {
  const ws = voice.ws; voice.ws = null;
  try { ws && ws.close(); } catch {}
  try { voice.stream && voice.stream.getTracks().forEach((t) => t.stop()); } catch {}
  try { voice.ctx && voice.ctx.close(); } catch {}
  voice.stream = null; voice.ctx = null;
}
$("voiceAll").onclick = () => { voiceStatus(""); setVoice(tiles, true); };
$("voiceOff").onclick = () => setVoice(tiles, false);

function updateSummary() {
  const live = tiles.filter((t) => t.active).length;
  const rec = tiles.filter((t) => t.recorder).length;
  $("summary").textContent = live ? `Active: ${live} · Recording: ${rec}` : "";
}

$("startAll").onclick = async () => {
  const record = $("recordToggle").checked;
  if (record) await ensureFolderPermission(); // ask once for all tiles
  tiles.forEach((t) => t.start(record));
};
$("stopAll").onclick = () => tiles.forEach((t) => t.stop());
$("pickFolder").onclick = pickFolder;

// Finish files properly if the page is closed while recording.
window.addEventListener("beforeunload", (e) => {
  if (tiles.some((t) => t.recorder)) { e.preventDefault(); e.returnValue = ""; }
});

(async () => {
  {
    try { CONFIG.fps = (await (await fetch("/api/fps", { cache: "no-store" })).json()).fps || CONFIG.fps; } catch {}
    const sel = $("fpsSelect");
    if (![...sel.options].some((o) => +o.value === CONFIG.fps)) sel.add(new Option(String(CONFIG.fps)));
    sel.value = String(CONFIG.fps);
    sel.onchange = async () => {
      try {
        CONFIG.fps = (await (await fetch(`/api/fps?fps=${sel.value}`, { method: "POST" })).json()).fps;
      } catch { warn("Cannot change FPS: server program is not running."); }
    };
    try { $("lessonInput").value = (await (await fetch("/api/lesson", { cache: "no-store" })).json()).app || ""; } catch {}
    const saveLesson = async () => {
      try {
        const r = await fetch(`/api/lesson?app=${encodeURIComponent($("lessonInput").value.trim())}`, { method: "POST" });
        $("lessonInput").value = (await r.json()).app;
        pollServer();
      } catch { warn("Cannot save the lesson app: server program is not running."); }
    };
    $("lessonInput").onchange = saveLesson;
    $("lessonInput").onkeydown = (e) => { if (e.key === "Enter") $("lessonInput").blur(); };
    await classesCall("");
    $("classSelect").onchange = () => classesCall(`current=${$("classSelect").value}`);
    $("openClassList").onclick = openClassList;
    $("clStudents").oninput = refreshClassList;
    $("clCancel").onclick = () => $("classList").close();
    $("clSave").onclick = saveClassList;
    $("renameClass").onclick = () => {
      const n = prompt("Name of this class", className());
      if (n && n.trim()) classesCall(`rename=${classes.current}&name=${encodeURIComponent(n.trim())}`);
    };
  }
  folder = (await kvGet("folder")) || null;
  showFolder();
  pollServer();
  setInterval(pollServer, 3000);
})();
